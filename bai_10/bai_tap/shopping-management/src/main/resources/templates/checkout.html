<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/layout :: head('Thanh toán')}">
    <title>Thanh toán</title>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>
<div class="container py-5">
    <div class="section-heading">
        <div>
            <span class="section-subtitle">CHECKOUT</span>
            <h2>Thông tin thanh toán</h2>
        </div>
    </div>
    <form th:action="@{/checkout}" th:object="${customerOrder}" id="checkoutForm" method="post">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="checkout-card">
                    <h4>Thông tin người nhận</h4>
                    <div class="mb-3">
                        <label for="receiverName" class="form-label">Họ và tên</label>
                        <input id="receiverName" type="text" class="form-control" th:field="*{receiverName}" placeholder="Nhập họ tên người nhận">
                        <small class="text-danger" th:errors="*{receiverName}"></small>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Số điện thoại</label>
                        <input id="phone" type="text" class="form-control" th:field="*{phone}" placeholder="Nhập số điện thoại">
                        <small class="text-danger" th:errors="*{phone}"></small>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Địa chỉ giao hàng</label>
                        <textarea id="address" class="form-control" rows="3" th:field="*{address}" placeholder="Nhập địa chỉ giao hàng"></textarea>
                        <small class="text-danger" th:errors="*{address}"></small>
                    </div>
                    <div class="mb-3">
                        <label for="paymentMethod" class="form-label">Phương thức thanh toán</label>
                        <select id="paymentMethod" class="form-select" th:field="*{paymentMethod}">
                            <option value="">-- Chọn phương thức --</option>
                            <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                            <option value="BANK_TRANSFER">Chuyển khoản ngân hàng</option>
                        </select>
                        <small class="text-danger" th:errors="*{paymentMethod}"></small>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="cart-summary">
                    <h4>Đơn hàng của bạn</h4>
                    <div class="checkout-product" th:each="entry : ${cart.productDtoMap}">
                        <div>
                            <strong th:text="${entry.key.name}">Sản phẩm</strong>
                            <small>x<span th:text="${entry.value}">1</span></small>
                        </div>
                        <span th:text="${#numbers.formatDecimal( entry.key.price * entry.value,0, 'COMMA', 0, 'POINT')} + ' đ'">    100.000 đ</span>
                    </div>
                    <hr>
                    <div class="summary-total">
                        <span>Tổng tiền</span>
                        <strong th:text="${#numbers.formatDecimal(cart.countTotalPayment(), 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</strong>
                    </div>
                    <button type="button" class="btn btn-primary w-100 mt-4" data-bs-toggle="modal" data-bs-target="#confirmOrderModal"><i class="bi bi-credit-card"></i> Xác nhận đặt hàng</button>
                    <a th:href="@{/shopping-cart}" class="btn btn-outline-secondary w-100 mt-2">Quay lại giỏ hàng</a>
                </div>
            </div>
        </div>
    </form>
</div>
<div class="modal fade" id="confirmOrderModal" tabindex="-1" aria-labelledby="confirmOrderLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmOrderLabel">Xác nhận thanh toán</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body text-center">
                <i class="bi bi-question-circle text-warning fs-1"></i>
                <p class="mt-3 mb-0">Bạn có chắc chắn muốn đặt hàng không?</p>
                <p class="text-muted small mt-2">Vui lòng kiểm tra lại thông tin đơn hàng trước khi xác nhận.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-success" onclick="confirmOrder()"><i class="bi bi-check-circle"></i> Đồng ý</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
