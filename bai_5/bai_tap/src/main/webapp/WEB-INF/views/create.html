<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{/layout/layout :: head('Tạo blog')}">
    <title></title>
</head>
<body>
<aside th:replace="~{/layout/layout :: aside}"></aside>
<main class="main">
    <div class="page-header">
        <div>
            <h3 class="fw-bold">Viết bài Blog mới</h3>
            <p class="text-secondary">Chia sẻ câu chuyện của bạn.</p>
        </div>
        <a th:href="@{/}" class="btn btn-light">← Quay lại</a>
    </div>
    <div class="form-container">
        <form th:action="@{/create}" th:object="${blog}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-4">
                <label for="title" class="form-label fw-semibold">Tiêu đề bài viết</label>
                <input id="title" type="text" th:field="*{title}" class="form-control" placeholder="Nhập tiêu đề bài viết..." required>
            </div>
            <div class="mb-4">
                <label for="content" class="form-label fw-semibold">Nội dung bài viết</label>
                <textarea id="content" th:field="*{content}" class="form-control" placeholder="Viết nội dung blog của bạn..." required></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">Lưu bài viết</button>
                <a th:href="@{/}" class="btn btn-light px-4">Hủy</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
