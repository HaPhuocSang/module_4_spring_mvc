<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark main-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><span class="brand-icon">S</span>Shopping Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/shopping-cart}"><i class="bi bi-cart3"></i>Giỏ hàng<span class="cart-badge" th:if="${cart != null}" th:text="${cart.countProductQuantity()}">0</span></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
