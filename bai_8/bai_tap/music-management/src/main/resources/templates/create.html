<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Thêm bài hát')}">
    <title></title>
</head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 700px">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Thêm bài hát mới</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/create}" th:object="${musicDto}" method="post">
                <div class="mb-3">
                    <label for="songTitle" class="form-label">Tên bài hát</label>
                    <input id="songTitle" type="text" th:field="*{songTitle}" class="form-control" placeholder="Nhập tên bài hát">
                    <small class="text-danger" th:errors="*{songTitle}"></small>
                </div>
                <div class="mb-3">
                    <label for="performingArtist" class="form-label">Nghệ sĩ thể hiện</label>
                    <input id="performingArtist" type="text" th:field="*{performingArtist}" class="form-control" placeholder="Nhập tên nghệ sĩ">
                    <small  class="text-danger" th:errors="*{performingArtist}"></small>
                </div>
                <div class="mb-3">
                    <label for="musicGenre" class="form-label">Thể loại nhạc</label>
                    <textarea id="musicGenre" th:field="*{musicGenre}" class="form-control" rows="4" placeholder="Nhập thể loại nhạc"></textarea>
                    <small class="text-danger" th:errors="*{musicGenre}"></small>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Lưu bài hát</button>
                    <a th:href="@{/}" class="btn btn-secondary">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
