<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">BlogSpace</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="header" class="site-header">
    <div class="container nav-wrap">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">B</span>BlogSpace
        </a>
        <nav>
            <a th:href="@{/}">Bài viết</a>
            <a th:href="@{/categories}">Danh mục</a>
            <a class="btn btn-primary" th:href="@{/create}">+ Viết bài</a>
        </nav>
    </div>
</header>
<footer th:fragment="footer" class="footer">
    BlogSpace · Chia sẻ kiến thức mỗi ngày
</footer>
<div th:fragment="deleteModal" id="deleteModal" class="modal-backdrop-custom">
    <div class="confirm-modal">
        <div class="modal-icon">!</div>
        <h3>Xác nhận xóa</h3>
        <p id="deleteMessage">
            Bạn có chắc chắn muốn xóa mục này không?
        </p>
        <div class="modal-actions">
            <button type="button" class="btn btn-light" id="cancelDelete">Hủy
            </button>
            <button type="button" class="btn btn-danger" id="confirmDelete">Xác nhận xóa</button>
        </div>
    </div>
</div>
</body>
</html>
