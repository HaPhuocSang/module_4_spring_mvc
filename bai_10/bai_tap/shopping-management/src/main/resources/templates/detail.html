<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/layout :: head('Chi tiết sản phẩm')}">
    <title></title>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>
<div class="container py-5">
    <div class="row g-5 align-items-center">
        <div class="col-md-5">
            <div class="detail-image">
                <i class="bi bi-box-seam"></i>
            </div>
        </div>
        <div class="col-md-7">
            <span class="section-subtitle">PRODUCT DETAIL</span>
            <h1 th:text="${product.name}">Tên sản phẩm</h1>
            <h3 class="product-price my-4" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">100.000 đ</h3>
            <p th:text="${product.description}">Mô tả sản phẩm</p>
            <p>Số lượng hiện có trong giỏ:<strong th:text="${quantity}">0</strong></p>
            <form th:action="@{/{id}/add(id=${product.id})}" method="post">
                <button type="submit" name="action" value="show" class="btn btn-primary btn-lg"><i class="bi bi-cart-plus"></i>Thêm vào giỏ hàng</button>
                <a th:href="@{/}" class="btn btn-outline-secondary btn-lg">Tiếp tục mua sắm</a>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
