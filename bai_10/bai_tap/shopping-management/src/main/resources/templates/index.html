<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/layout :: head('Trang chủ')}">
    <title></title>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>
<section class="hero-section">
    <div class="container">
        <div class="hero-content">
            <span class="hero-label">WELCOME TO SHOPPING STORE</span>
            <h1>Mua sắm dễ dàng<br>Chất lượng hàng đầu</h1>
            <p>Khám phá những sản phẩm tốt nhất dành cho bạn.</p>
            <a href="#products" class="btn btn-light btn-lg">
                Khám phá ngay
            </a>
        </div>
    </div>
</section>
<section class="container py-5" id="products">
    <div class="section-heading">
        <div>
            <span class="section-subtitle">OUR PRODUCTS</span>
            <h2>Sản phẩm nổi bật</h2>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="product : ${products.content}">
            <div class="product-card">
                <div class="product-image">
                    <i class="bi bi-box-seam"></i>
                </div>
                <div class="product-info">
                    <h5 th:text="${product.name}">Tên sản phẩm</h5>
                    <p class="product-description" th:text="${product.description}">Mô tả sản phẩm</p>
                    <div class="product-bottom">
                        <span class="product-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">100.000 đ</span>
                        <a th:href="@{/{id}/detail(id=${product.id})}" class="btn btn-primary">Chi tiết</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="pagination-wrapper" th:if="${products.totalPages > 1}">
        <a th:if="${products.hasPrevious()}" th:href="@{/(page=${products.number - 1})}" class="btn btn-outline-primary">Trước</a>
        <span class="page-number" th:text="${products.number + 1} + ' / ' + ${products.totalPages}"></span>
        <a th:if="${products.hasNext()}" th:href="@{/(page=${products.number + 1})}" class="btn btn-outline-primary">Sau</a>
    </div>
</section>
<div th:replace="~{layout/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
