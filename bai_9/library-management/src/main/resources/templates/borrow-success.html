<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mượn sách thành công</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="logo">Library Management</div>
    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/return}">Trả sách</a>
    </nav>
</header>
<main class="container">
    <div class="success-card">
        <h2>Mượn sách thành công!</h2>
        <p>Bạn đã mượn sách thành công.</p>
        <p>Mã mượn sách của bạn là:</p>
        <div class="borrow-code" th:text="${borrowCode}"></div>
        <p>Vui lòng lưu lại mã này để sử dụng khi trả sách.</p>
        <a th:href="@{/}" class="btn">Về trang chủ</a>
    </div>
</main>
</body>
</html>
