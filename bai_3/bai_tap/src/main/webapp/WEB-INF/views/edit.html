<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">

    <div class="form-container">
        <h2 class="text-center mb-2">Cập nhật sản phẩm</h2>
        <p class="text-center text-muted mb-4">Chỉnh sửa thông tin sản phẩm</p>
        <form th:action="@{/edit}" th:object="${product}" method="post">
            <div class="mb-3">
                <label for="id" class="form-label">Mã sản phẩm</label>
                <input id="id" type="text" th:field="*{id}" class="form-control" readonly>
            </div>
            <div class="mb-3">
                <label for="productName" class="form-label">Tên sản phẩm</label>
                <input id="productName" type="text" th:field="*{productName}" class="form-control">
                <small class="text-danger" th:errors="*{productName}"></small>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Giá sản phẩm</label>
                <input id="price" type="number" th:field="*{price}" class="form-control" min="0">
                <small class="text-danger" th:errors="*{price}"></small>
            </div>
            <div class="mb-3">
                <label for="manufacturer" class="form-label">Nhà sản xuất</label>
                <input id="manufacturer" type="text" th:field="*{manufacturer}" class="form-control">
                <small class="text-danger" th:errors="*{manufacturer}"></small>
            </div>
            <div class="mb-4">
                <label for="description" class="form-label">Mô tả sản phẩm</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="5"></textarea>
                <small class="text-danger" th:errors="*{description}"></small>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning">Lưu thay đổi</button>
                <a th:href="@{/}" class="btn btn-secondary">Quay lại</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
