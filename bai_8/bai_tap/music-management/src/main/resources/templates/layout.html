<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Music Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            Music Management
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Danh sách bài hát</a>
            <a class="nav-link" th:href="@{/create}">Thêm bài hát</a>
        </div>
    </div>
</nav>
<footer th:fragment="footer"
        class="text-center text-muted py-4 mt-5">
    <p class="mb-0">Music Management © 2026</p>
</footer>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/music.js}"></script>
</th:block>
</body>
</html>
