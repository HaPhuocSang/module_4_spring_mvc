<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý danh mục</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{layout/layout :: header}"></header>
<main class="container page">
    <a class="back-link" th:href="@{/}">← Về trang bài viết</a>
    <div th:if="${message}" class="alert" th:text="${message}"></div>
    <div class="section-heading">
        <div>
            <span class="eyebrow">BLOGSPACE MANAGEMENT</span>
            <h1>Quản lý danh mục</h1>
            <p class="muted">Tổ chức bài viết theo từng chủ đề.</p>
        </div>
    </div>
    <div class="category-layout">
        <section class="form-panel category-form">
            <h2 th:text="${category.id == null ? 'Thêm danh mục' : 'Cập nhật danh mục'}"></h2>
            <form th:object="${category}" th:action="${category.id == null ? '/categories/create' : '/categories/edit'}"
                  method="post" class="main-form">
                <input type="hidden" th:field="*{id}">
                <label for="name">Tên danh mục</label>
                <input id="name" type="text" th:field="*{name}" placeholder="Ví dụ: Công nghệ">
                <small class="field-error" th:errors="*{name}"></small>
                <div class="form-actions">
                    <a class="btn btn-light" th:href="@{/categories}">Làm mới</a>
                    <button class="btn btn-primary" type="submit">Lưu danh mục</button>
                </div>
            </form>
        </section>
        <section class="table-panel">
            <h2>Danh sách danh mục</h2>
            <div th:if="${#lists.isEmpty(categories)}" class="empty-state">Chưa có danh mục.
            </div>
            <div class="category-row" th:each="category : ${categories}">
                <div>
                    <b th:text="${category.name}"></b>
                    <small th:text="${'Mã danh mục: ' + category.id}"></small>
                </div>
                <div class="row-actions">
                    <a th:href="@{/categories/{id}/edit(id=${category.id})}">Sửa</a>
                    <form th:id="'delete-category-' + ${category.id}" th:action="@{/categories/delete}" method="post">
                        <input type="hidden" name="id" th:value="${category.id}">
                        <button type="button" class="link-danger js-delete" th:attr="data-form='delete-category-' + ${category.id}, data-name=${category.name}">Xóa</button>
                    </form>
                </div>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{layout/layout :: footer}"></footer>
<div th:replace="~{layout/layout :: deleteModal}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
