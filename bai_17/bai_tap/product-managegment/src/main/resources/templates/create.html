
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{/layout/layout :: head('Thêm sản phẩm')}">
    <title></title>
</head>
<body>
<div class="form-container">
    <h1>Thêm sản phẩm mới</h1>
    <form th:action="@{/create}" th:object="${product}" method="post">
        <label for="name">Tên sản phẩm</label>
        <input id="name" type="text" th:field="*{name}" placeholder="Nhập tên sản phẩm" required>
        <label for="price">Giá sản phẩm</label>
        <input id="price" type="number" th:field="*{price}" min="0" step="any" required>
        <label for="description">Mô tả sản phẩm</label>
        <textarea id="description" th:field="*{description}" placeholder="Nhập mô tả"></textarea>
        <label for="manufacturer">Nhà sản xuất</label>
        <input id="manufacturer" type="text" th:field="*{manufacturer}" placeholder="Nhập nhà sản xuất" required>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Thêm sản phẩm</button>
            <a th:href="@{/}" class="btn btn-cancel">Quay lại</a>
        </div>
    </form>
</div>
</body>
</html>
