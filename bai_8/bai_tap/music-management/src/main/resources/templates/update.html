<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Cập nhật bài hát')}">
    <title></title>
</head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 700px">
        <div class="card-header bg-warning">
            <h4 class="mb-0">Cập nhật bài hát</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/update}" th:object="${musicDto}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label for="songTitle" class="form-label">Tên bài hát</label>
                    <input id="songTitle" type="text" th:field="*{songTitle}" class="form-control">
                    <small class="text-danger" th:errors="*{songTitle}"></small>
                </div>
                <div class="mb-3">
                    <label for="performingArtist" class="form-label">Nghệ sĩ thể hiện</label>
                    <input id="performingArtist" type="text" th:field="*{performingArtist}" class="form-control">
                    <small class="text-danger" th:errors="*{performingArtist}"></small>
                </div>
                <div class="mb-3">
                    <label for="musicGenre" class="form-label">Thể loại nhạc</label>
                    <textarea id="musicGenre" th:field="*{musicGenre}" class="form-control" rows="4"></textarea>
                    <small class="text-danger" th:errors="*{musicGenre}"></small>
                </div>
                <button type="submit" class="btn btn-warning">Cập nhật</button>
                <a th:href="@{/}" class="btn btn-secondary">Quay lại</a>
            </form>
        </div>
    </div>
</div>
<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
