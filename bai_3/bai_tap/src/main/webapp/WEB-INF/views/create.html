<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
    <div class="form-container">
        <h2 class="text-center mb-2">Thêm sản phẩm mới</h2>
        <p class="text-center text-muted mb-4">Nhập đầy đủ thông tin sản phẩm</p>
        <form th:action="@{/create}" th:object="${product}" method="post">
            <div class="mb-3">
                <label for="productName" class="form-label">Tên sản phẩm</label>
                <input id="productName" type="text" th:field="*{productName}" class="form-control" placeholder="Nhập tên sản phẩm">
                <small class="text-danger" th:errors="*{productName}"></small>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Giá sản phẩm</label>
                <input id="price" type="number" th:field="*{price}" class="form-control" placeholder="Nhập giá sản phẩm" min="0">
                <small class="text-danger" th:errors="*{price}"></small>
            </div>
            <div class="mb-3">
                <label for="manufacturer" class="form-label">Nhà sản xuất</label>
                <input id="manufacturer" type="text" th:field="*{manufacturer}" class="form-control" placeholder="Nhập nhà sản xuất">
                <small class="text-danger" th:errors="*{manufacturer}"></small>
            </div>
            <div class="mb-4">
                <label for="description" class="form-label">Mô tả sản phẩm</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="5" placeholder="Nhập mô tả sản phẩm"></textarea>
                <small class="text-danger" th:errors="*{description}"></small>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Thêm sản phẩm</button>
                <a th:href="@{/}" class="btn btn-secondary">Quay lại</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
