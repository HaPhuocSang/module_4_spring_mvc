<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="register-wrapper">
    <div class="register-card">
        <div class="register-header">
            <div class="logo"><i class="icon">✦</i></div>
            <h2>Create Account</h2>
            <p>Đăng ký tài khoản mới của bạn</p>
        </div>
        <div class="success-message" th:if="${message}" th:text="${message}"></div>
        <div class="error-alert" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/}" th:object="${userDto}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" th:field="*{username}" placeholder="Nhập username">
                <span class="field-error" th:errors="*{username}"></span>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" th:field="*{email}" placeholder="example@gmail.com">
                <span class="field-error" th:errors="*{email}"></span>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" th:field="*{password}" placeholder="Nhập mật khẩu">
                <span class="field-error" th:errors="*{password}"></span>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu">
                <span class="field-error" th:errors="*{confirmPassword}"></span>
            </div>
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input id="phoneNumber" type="text" th:field="*{phoneNumber}" placeholder="Nhập số điện thoại">
                <span class="field-error" th:errors="*{phoneNumber}"></span>
            </div>
            <button type="submit" class="register-btn">Create Account</button>
        </form>
        <div class="login-link">Đã có tài khoản?<a href="#">Đăng nhập</a></div>
    </div>
</div>
</body>
</html>
