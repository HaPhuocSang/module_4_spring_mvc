<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo lỗi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="logo">Library Management</div>
    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/return}">Trả sách</a>
    </nav>
</header>
<main class="container">
    <div class="error-card">
        <h2>Đã xảy ra lỗi!</h2>
        <p class="error-message" th:text="${errorMessage}">Không thể thực hiện yêu cầu.</p>
        <a th:href="@{/}" class="btn">Về trang chủ</a>
        <a th:href="@{/return}" class="btn btn-secondary">Thử trả sách lại</a>
    </div>
</main>
</body>
</html>
