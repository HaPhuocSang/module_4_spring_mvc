<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
    <div class="detail-container">
        <h2 class="mb-4">Chi tiết sản phẩm</h2>
        <div class="row">
            <div class="col-md-12">
                <div class="detail-item">
                    <label>Mã sản phẩm</label>
                    <p th:text="${product.id}"></p>
                </div>
                <div class="detail-item">
                    <label>Tên sản phẩm</label>
                    <p th:text="${product.productName}"></p>
                </div>
                <div class="detail-item">
                    <label>Giá sản phẩm</label>
                    <p th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></p>
                </div>
                <div class="detail-item">
                    <label>Nhà sản xuất</label>
                    <p th:text="${product.manufacturer}"></p>
                </div>
                <div class="detail-item">
                    <label>Mô tả sản phẩm</label>
                    <p th:text="${product.description}"></p>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <a th:href="@{/{id}/edit(id=${product.id})}" class="btn btn-warning">Cập nhật</a>
                    <a th:href="@{/}" class="btn btn-secondary">Quay lại</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
